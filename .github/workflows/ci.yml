name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0', '22.23.4', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Deterministic install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax validation
        run: npm run check
      - name: Static security preflight
        run: npm run release:preflight
      - name: Unit, integration, and crash tests
        run: npm test
      - name: Multi-process contention stress
        run: npm run test:stress
      - name: Coverage gate
        if: matrix.node == '22.23.4'
        run: npm run test:coverage
      - name: Production dependency vulnerability audit
        if: matrix.node == '22.23.4'
        run: npm audit --omit=dev --audit-level=high
