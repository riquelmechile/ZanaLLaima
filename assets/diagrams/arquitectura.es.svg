<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" role="img" aria-labelledby="zlaes-t zlaes-d">
<title id="zlaes-t">Arquitectura de ZanaLLaima</title>
<desc id="zlaes-d">La app de ChatGPT se conecta por MCP con OAuth a ZanaLLaima en zana-main. ZanaLLaima usa el MCP oficial de GitHub para escribir solo en la rama de la misión, GitHub Actions corre los tests y la cuenta revisora firma la review; el merge exige el SHA exacto.</desc>
