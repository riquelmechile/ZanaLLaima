" fill="#1F2933" text-anchor="start">push</text><path d="M895 292 V312" fill="none" stroke="#1F2933" stroke-width="2.5"  marker-end="url(#zlaes-a)"/><path d="M778 362 H688" fill="none" stroke="#D9661A" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#zlaes-o)"/><text x="733" y="338" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#D9661A" text-anchor="middle">resultado</text><text x="733" y="352" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#D9661A" text-anchor="middle">de checks</text><text x="520" y="435" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#52606D" text-anchor="middle">Los tokens viven solo en el servidor. La verdad es el SHA en GitHub y sus checks.</text></svg>
