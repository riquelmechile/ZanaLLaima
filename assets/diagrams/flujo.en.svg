<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="zlfen-t zlfen-d">
<title id="zlfen-t">ZanaLLaima workflow</title>
<desc id="zlfen-d">Three lanes: the author conversation creates the mission, writes to the branch, waits for green checks, completes the unit and requests a ticket; a new reviewer conversation claims the ticket, reads the full diff, runs the four lenses and finalizes; GitHub receives the review signed by the reviewer account, and zana_merge merges with the exact SHA. If changes are requested, zana_correction_start goes back to the author lane.</desc>
