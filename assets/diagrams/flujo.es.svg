<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="zlfes-t zlfes-d">
<title id="zlfes-t">Flujo de trabajo de ZanaLLaima</title>
<desc id="zlfes-d">Tres carriles: la conversación autora crea la misión, escribe en la rama, espera checks verdes, completa la unidad y pide un ticket; una conversación revisora nueva reclama el ticket, lee el diff completo, corre los cuatro lentes y finaliza; GitHub recibe la review firmada por la cuenta revisora, y zana_merge mergea con el SHA exacto. Si se piden cambios, zana_correction_start vuelve al carril autor.</desc>
<defs><marker id="zlfes-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1F2933"/></marker><marker id="zlfes-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9661A"/></marker></defs>
<rect x="1" y="1" width="1038" height="468" rx="20" fill="#FFFFFF" stroke="#E4E7EB" stroke-width="2"/>
