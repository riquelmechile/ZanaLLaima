t><text x="427.0" y="117" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="middle">en zana/&lt;misión&gt;</text><rect x="524" y="65" width="150" height="70" rx="12" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="2"/><text x="599.0" y="95" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#1F2933" text-anchor="middle">3 Checks verdes</text><text x="599.0" y="117" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="middle">en GitHub Actions</text><rect x="696" y="65" width="150" height="70" rx="12" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="2"/><text x="771.0" y="95" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#1F2933" text-anchor="middle">4 Completa</text><text x="771.0" y="117" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="middle">la unidad</text><rect x="868" y="65" width="150" height="70" rx="12" fill="#FFFFFF" stroke="#D9661A" stroke-width="2"/><text x="943.0" y="95" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#1F2933" text-anchor="middle">5 Pide ticket</text><text x="943.0" y="117" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="middle">ZR-…</text><path d="M332 100 H348" fill="none" stroke="#1F2933" stroke-width="2.5"  marker-end="url(#zlfes-a)"/><path d="M504 100 H520" fill="none" stroke="#1F2933" stroke-width="2.5"  marker-end="url(#zlfes-a)"/><path d="M676 100 H692" fill="none" stroke="#1F2933" stroke-width="2.5"  marker-end="url(#zlfes-a)"/><path d="M848 100 H864" fill="none" stroke="#1F2933" stroke-width="2.5"  marker-end="url(#zlfes-a)"/><rect x="868" y="205" width="150" height="70" rx="12" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="2"/><text x="943.0" y="235" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#1F2933" text-anchor="middle">6 Reclama</text><text x="943.0" y="257" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="middle">el ticket</text><rect x="696" y="205" width="150" height="70" rx="12" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="2"/><text x="771.0" y="235" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#1F2933" text-anchor="middle">7 Lee el diff</text><text x="771.0" y="257" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="middle">completo</text><rect x="524" y="205" width="150" height="70" rx="12" fill="#FFFFFF" stroke="#D9661A" stroke-width="2"/><text x="599.0" y="235" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#1F2933" text-anchor="middle">8 Cuatro lentes</text><text x="599.0" y="257" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="middle">R1 · R2 · R3 · R4</text><rect x="352" y="205" width="150" height="70" rx="12" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="2"/><text x="427.0" y="235" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#1F2933" text-anchor="middle">9 Finaliza</text><text x="427.0" y="257" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#52606D" text-anchor="middle">mismo SHA</text><path d="M943.0 137 V201" fill="none" stroke="#1F293